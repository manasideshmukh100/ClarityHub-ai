version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clarityhub-db
    environment:
      POSTGRES_USER: clarityuser
      POSTGRES_PASSWORD: claritypassword
      POSTGRES_DB: clarityhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clarityhub-backend
    environment:
      - DATABASE_URL=postgresql://clarityuser:claritypassword@db:5432/clarityhub_db
      - LLM_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-clarityhub-secret-key-production-2026}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clarityhub-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
